<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Correlation matrix</title>
    <script src="./lib/tableau.extensions.1.17.0.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      body { font-family: "Benton Sans", "Segoe UI", system-ui, sans-serif; font-size: 12px; color: #333; }
      .dlg { display: flex; flex-direction: column; height: 100%; }
      .dlg > :first-child { flex: 1; overflow-y: auto; padding: 4px 4px 12px; }
      .stack { display: grid; gap: 12px; padding: 4px 8px 8px; }
      .row { display: flex; gap: 12px; }
      .note { margin: 0; color: #666; font-size: 11px; line-height: 1.4; }
      .field-label { margin: 0 0 6px; font-size: 12px; color: #333; }
      .close-note { padding: 8px 12px 0; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid #e6e6e6; }
    </style>
  </head>
  <body>
    <div id="root" style="height:100%"></div>
    <script type="module" src="/src/dialog/tableau-ui.tsx"></script>
  </body>
</html>
